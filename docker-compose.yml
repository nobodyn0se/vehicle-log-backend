version: '3.8'

services:
  cassandra:
    image: cassandra:latest
    container_name: cassandra-container
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: "VehicleLogCluster"
      CASSANDRA_DC: "datacenter1"
      CASSANDRA_RACK: "rack1"
    volumes:
      - cassandra-data:/var/lib/cassandra

volumes:
  cassandra-data:
